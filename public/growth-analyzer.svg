<svg
  viewBox="0 0 360 280"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="growth-analyzer-title"
>
  <title id="growth-analyzer-title">Digital Growth Analyzer</title>

  <!-- Device / panel -->
  <rect
    x="8"
    y="8"
    width="344"
    height="264"
    rx="20"
    fill="rgba(255,255,255,0.1)"
    stroke="rgba(255,255,255,0.25)"
    stroke-width="1.5"
  />

  <!-- Header -->
  <rect x="28" y="28" width="120" height="10" rx="5" fill="rgba(255,255,255,0.35)" />
  <rect x="28" y="46" width="72" height="7" rx="3.5" fill="#e17cf6" fill-opacity="0.8" />

  <!-- Score ring -->
  <circle
    cx="280"
    cy="68"
    r="36"
    stroke="rgba(255,255,255,0.15)"
    stroke-width="8"
    fill="none"
  />
  <circle
    cx="280"
    cy="68"
    r="36"
    stroke="#e17cf6"
    stroke-width="8"
    stroke-linecap="round"
    stroke-dasharray="170 226"
    stroke-dashoffset="40"
    fill="none"
    transform="rotate(-90 280 68)"
  />
  <text
    x="280"
    y="64"
    text-anchor="middle"
    fill="#ffffff"
    font-size="18"
    font-weight="700"
    font-family="system-ui, sans-serif"
  >
    86
  </text>
  <text
    x="280"
    y="82"
    text-anchor="middle"
    fill="rgba(255,255,255,0.5)"
    font-size="8"
    letter-spacing="0.12em"
    font-family="system-ui, sans-serif"
  >
    SCORE
  </text>

  <!-- Radar hexagon for 6 analysis areas -->
  <g transform="translate(100 160)">
    <polygon
      points="0,-58 50,-29 50,29 0,58 -50,29 -50,-29"
      stroke="rgba(255,255,255,0.15)"
      stroke-width="1.5"
      fill="none"
    />
    <polygon
      points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19"
      stroke="rgba(255,255,255,0.1)"
      stroke-width="1"
      fill="none"
    />
    <polygon
      points="0,-20 17,-10 17,10 0,20 -17,10 -17,-10"
      stroke="rgba(255,255,255,0.1)"
      stroke-width="1"
      fill="none"
    />
    <!-- Axes -->
    <path
      d="M0 0 L0 -58 M0 0 L50 -29 M0 0 L50 29 M0 0 L0 58 M0 0 L-50 29 M0 0 L-50 -29"
      stroke="rgba(255,255,255,0.1)"
      stroke-width="1"
    />
    <!-- Data shape -->
    <polygon
      points="0,-48 38,-18 42,16 0,34 -28,22 -40,-12"
      fill="#e17cf6"
      fill-opacity="0.25"
      stroke="#e17cf6"
      stroke-width="2"
    />
    <circle cx="0" cy="-48" r="3.5" fill="#e17cf6" />
    <circle cx="38" cy="-18" r="3.5" fill="#ffffff" />
    <circle cx="42" cy="16" r="3.5" fill="#e17cf6" />
    <circle cx="0" cy="34" r="3.5" fill="#ffffff" />
    <circle cx="-28" cy="22" r="3.5" fill="#e17cf6" />
    <circle cx="-40" cy="-12" r="3.5" fill="#ffffff" />
  </g>

  <!-- Checklist chips - areas analyzed -->
  <g>
    <!-- Performance -->
    <rect x="200" y="120" width="132" height="20" rx="10" fill="rgba(255,255,255,0.1)" />
    <circle cx="214" cy="130" r="4" fill="#27c93f" />
    <rect x="224" y="127" width="70" height="6" rx="3" fill="rgba(255,255,255,0.45)" />

    <!-- Mobile -->
    <rect x="200" y="146" width="132" height="20" rx="10" fill="rgba(255,255,255,0.1)" />
    <circle cx="214" cy="156" r="4" fill="#e17cf6" />
    <rect x="224" y="153" width="58" height="6" rx="3" fill="rgba(255,255,255,0.45)" />

    <!-- SEO -->
    <rect x="200" y="172" width="132" height="20" rx="10" fill="rgba(255,255,255,0.1)" />
    <circle cx="214" cy="182" r="4" fill="#27c93f" />
    <rect x="224" y="179" width="64" height="6" rx="3" fill="rgba(255,255,255,0.45)" />

    <!-- UX -->
    <rect x="200" y="198" width="132" height="20" rx="10" fill="rgba(255,255,255,0.1)" />
    <circle cx="214" cy="208" r="4" fill="rgba(255,255,255,0.6)" />
    <rect x="224" y="205" width="52" height="6" rx="3" fill="rgba(255,255,255,0.45)" />

    <!-- Conversion -->
    <rect x="200" y="224" width="132" height="20" rx="10" fill="rgba(255,255,255,0.1)" />
    <circle cx="214" cy="234" r="4" fill="#e17cf6" />
    <rect x="224" y="231" width="76" height="6" rx="3" fill="rgba(255,255,255,0.45)" />
  </g>

  <!-- Mini sparkline under radar -->
  <path
    d="M40 248 C58 242, 70 230, 88 228 C106 226, 118 238, 136 234 C150 231, 158 220, 170 218"
    stroke="rgba(255,255,255,0.5)"
    stroke-width="2"
    stroke-linecap="round"
    fill="none"
  />
  <circle cx="170" cy="218" r="3" fill="#e17cf6" />
</svg>
